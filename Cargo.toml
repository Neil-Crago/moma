[package]
name = "moma"
version = "1.0.0"
edition = "2024"
authors = ["Neil Crago"]
description = "Moving Origin Modular Arithmetic (MOMA): moving-axis analysis of spirals and helices, and barycentric consensus"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neil-crago/moma"
documentation = "https://docs.rs/moma"
keywords = ["barycenter", "helix", "spiral", "signal-analysis", "consensus"]
include = [
    "src/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

