[package]
name = "moma"
version = "0.5.0"
edition = "2024"
authors = ["Neil Crago"]
description = "Moving Origin Modular Arithmetic (MOMA): moving-axis analysis of spirals and helices, plus ring barycentres and prime-based signatures"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neil-crago/moma"
documentation = "https://docs.rs/moma"
keywords = ["modulo", "barycenter", "helix", "spiral", "signal-analysis"]
include = [
    "src/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
rand = "0.9.2"


